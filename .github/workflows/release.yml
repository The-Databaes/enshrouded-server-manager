# Builds the Windows installer, signs it for the updater and attaches both,
# plus latest.json, to a draft GitHub release. Publishing the draft is what
# ships it: the app reads releases/latest/download/latest.json, and GitHub's
# "latest" never points at a draft or a pre-release.
#
# Release: bump "version" in src-tauri/tauri.conf.json, commit, then
#   git tag v0.2.0 && git push origin v0.2.0
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   TAURI_SIGNING_PRIVATE_KEY           contents of ~/.tauri/enshrouded-server-manager.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A tag that doesn't match the app's version would publish an update
      # the updater never offers (it compares versions, not tags).
      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match version $version in src-tauri/tauri.conf.json"
            exit 1
          fi

      - name: Check the signing key is set
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Add the TAURI_SIGNING_PRIVATE_KEY secret: updates can't be signed without it."
            exit 1
          fi

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

      # GitHub's generated notes (merged pull requests since the last
      # release). Passed to the release and to latest.json, which is where
      # the app's "What's new" comes from.
      - name: Write the release notes
        id: notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          notes=$(gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="v$version" --jq .body || echo "")
          {
            echo "body<<__NOTES__"
            echo "$notes"
            echo "__NOTES__"
          } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: Enshrouded Server Manager v__VERSION__
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          # Updater artifacts (and so the signing key) only for releases:
          # local `pnpm build` keeps working without the key.
          args: --config src-tauri/tauri.release.conf.json
