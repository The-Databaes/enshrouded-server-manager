[package]
name = "enshrouded-server-manager"
version = "0.1.0"
description = "Install, run and update an Enshrouded dedicated server"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "enshrouded_server_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tauri-plugin-dialog = "2.8.1"
# The manager updates itself; desktop-only, like the rest of the app.
tauri-plugin-updater = "2.14.1"
thiserror = "2.0.21"
# native-tls uses SChannel on Windows (no build tooling, honours the OS cert store);
# system-proxy picks up the Windows proxy settings.
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "system-proxy"] }
zip = { version = "9.0.1", default-features = false, features = ["deflate"] }
tokio = { version = "1.53.2", features = ["macros", "net", "rt", "sync", "time"] }
tokio-util = "0.7.20"
portable-pty = "0.9.0"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }

[lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# Deny all warnings - treat them as errors
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

# Unimplemented items can be left as warnings
todo = "warn"
unimplemented = "warn"

# Correctness (deny)
cast_lossless = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_precision_loss = "deny"
cast_sign_loss = "deny"

# Performance (warn/deny)
inefficient_to_string = "deny"
large_enum_variant = "warn"
large_stack_arrays = "warn"
needless_pass_by_value = "warn"

# Style (warn)
missing_errors_doc = "warn"
missing_panics_doc = "warn"

[dev-dependencies]
tempfile = "3.27.0"

