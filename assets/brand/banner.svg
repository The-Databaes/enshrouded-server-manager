<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 480" width="1600" height="480">
  <!--
    README banner. The icon is referenced as `icon.svg`; `pnpm assets` inlines
    it as a data URI so the rendered banner.png and public/banner.svg are
    self-contained.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1436"/>
      <stop offset="1" stop-color="#0d0919"/>
    </linearGradient>
    <radialGradient id="haze" cx="1000" cy="210" r="620" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3d2a72" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#3d2a72" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="iconGlow" cx="256" cy="230" r="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff9f40" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#9a4bd0" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#9a4bd0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="800" cy="220" r="900" gradientUnits="userSpaceOnUse">
      <stop offset="0.55" stop-color="#05030b" stop-opacity="0"/>
      <stop offset="1" stop-color="#05030b" stop-opacity="0.7"/>
    </radialGradient>
    <linearGradient id="goldText" x1="0" y1="118" x2="0" y2="238" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff3cf"/>
      <stop offset="0.4" stop-color="#f7c55c"/>
      <stop offset="0.75" stop-color="#e09430"/>
      <stop offset="1" stop-color="#b86a1e"/>
    </linearGradient>
    <linearGradient id="hairline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e09430" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#f7c55c"/>
      <stop offset="1" stop-color="#e09430" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ruleLeft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f7c55c" stop-opacity="0"/>
      <stop offset="1" stop-color="#f7c55c"/>
    </linearGradient>
    <linearGradient id="ruleRight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f7c55c"/>
      <stop offset="1" stop-color="#f7c55c" stop-opacity="0"/>
    </linearGradient>

    <filter id="blur6" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="blur14" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="blur30" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="30"/></filter>
    <filter id="spark" filterUnits="userSpaceOnUse" x="0" y="0" width="1600" height="480">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="iconShadow" filterUnits="userSpaceOnUse" x="0" y="0" width="600" height="480">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#05030b" flood-opacity="0.75"/>
    </filter>

    <clipPath id="frame">
      <rect width="1600" height="480" rx="24" ry="24"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1600" height="480" fill="url(#bg)"/>
    <rect width="1600" height="480" fill="url(#haze)"/>
    <rect width="1600" height="480" fill="url(#iconGlow)"/>

    <!-- Stars -->
    <g fill="#d9c8ff">
      <circle cx="548" cy="70" r="2" opacity="0.4"/>
      <circle cx="690" cy="128" r="1.5" opacity="0.3"/>
      <circle cx="1210" cy="58" r="2" opacity="0.45"/>
      <circle cx="1398" cy="112" r="2.5" opacity="0.4"/>
      <circle cx="1520" cy="64" r="1.5" opacity="0.35"/>
      <circle cx="880" cy="44" r="1.5" opacity="0.3"/>
      <circle cx="1490" cy="236" r="2" opacity="0.3"/>
      <circle cx="80" cy="60" r="2" opacity="0.35"/>
    </g>

    <!-- Embervale: far ridges with distant beacons -->
    <path d="M0 404 L90 362 L160 384 L250 330 L330 372 L420 350 L520 398 L640 368 L720 386 L820 336 L900 372 L1000 350 L1090 392 L1190 342 L1270 368 L1370 322 L1450 360 L1530 340 L1600 372 L1600 480 L0 480 Z" fill="#2a1f4e"/>
    <path d="M1521 344 L1524 304 L1530 294 L1536 306 L1539 344 Z" fill="#2a1f4e"/>
    <path d="M1365 324 L1368 280 L1374 268 L1380 282 L1383 324 Z" fill="#2a1f4e"/>
    <circle cx="1530" cy="290" r="14" fill="#ffae52" opacity="0.35" filter="url(#blur6)"/>
    <circle cx="1530" cy="290" r="3" fill="#ffd38a"/>
    <circle cx="1374" cy="264" r="16" fill="#ffae52" opacity="0.4" filter="url(#blur6)"/>
    <circle cx="1374" cy="264" r="3.5" fill="#ffd38a"/>
    <ellipse cx="900" cy="402" rx="900" ry="34" fill="#6d4cba" opacity="0.4" filter="url(#blur30)"/>
    <path d="M0 440 L120 418 L260 430 L400 412 L560 434 L720 420 L880 436 L1040 414 L1200 432 L1360 416 L1500 430 L1600 420 L1600 480 L0 480 Z" fill="#191231"/>

    <!-- The Shroud -->
    <ellipse cx="260" cy="470" rx="420" ry="60" fill="#9a6fe0" opacity="0.5" filter="url(#blur30)"/>
    <ellipse cx="900" cy="486" rx="560" ry="60" fill="#7b4fd1" opacity="0.55" filter="url(#blur30)"/>
    <ellipse cx="1430" cy="470" rx="380" ry="60" fill="#8a63d8" opacity="0.45" filter="url(#blur30)"/>
    <ellipse cx="560" cy="436" rx="220" ry="10" fill="#c7a8f7" opacity="0.35" filter="url(#blur6)"/>
    <ellipse cx="1180" cy="444" rx="260" ry="10" fill="#c7a8f7" opacity="0.3" filter="url(#blur6)"/>

    <!-- Embers -->
    <g filter="url(#spark)">
      <circle cx="470" cy="96" r="4" fill="#ffc46b"/>
      <circle cx="420" cy="368" r="3" fill="#ffb457" opacity="0.7"/>
      <circle cx="610" cy="300" r="3" fill="#ffc46b" opacity="0.7"/>
      <circle cx="1440" cy="180" r="3.5" fill="#ffd99a" opacity="0.8"/>
      <circle cx="1180" cy="392" r="2.5" fill="#ffb457" opacity="0.6"/>
      <circle cx="1310" cy="88" r="2.5" fill="#ffd99a" opacity="0.6"/>
      <circle cx="730" cy="60" r="2.5" fill="#ffc46b" opacity="0.6"/>
      <circle cx="140" cy="430" r="3" fill="#ffb457" opacity="0.6"/>
    </g>

    <rect width="1600" height="480" fill="url(#vignette)"/>
  </g>

  <!-- Icon -->
  <image x="96" y="70" width="320" height="320" href="icon.svg" xlink:href="icon.svg" filter="url(#iconShadow)"/>

  <!-- Wordmark. resvg only renders Cinzel's default weight, so a stroke in
       the same paint builds it up to bold. x is offset by half the letter
       spacing, which text-anchor counts after the last letter too. -->
  <g font-family="Cinzel" font-size="112" letter-spacing="12" text-anchor="middle" paint-order="stroke">
    <text x="1006" y="226" fill="#ff9a3c" stroke="#ff9a3c" stroke-width="10" opacity="0.55" filter="url(#blur14)">ENSHROUDED</text>
    <text x="1006" y="231" fill="#05030b" stroke="#05030b" stroke-width="4" opacity="0.65">ENSHROUDED</text>
    <text x="1006" y="226" fill="url(#goldText)" stroke="url(#goldText)" stroke-width="3.5">ENSHROUDED</text>
  </g>

  <!-- Divider -->
  <rect x="700" y="276" width="280" height="2" fill="url(#ruleLeft)"/>
  <rect x="1020" y="276" width="280" height="2" fill="url(#ruleRight)"/>
  <path d="M1000 264 L1013 277 L1000 290 L987 277 Z" fill="#f7c55c"/>
  <path d="M1000 270 L1007 277 L1000 284 L993 277 Z" fill="#fff3cf"/>
  <circle cx="970" cy="277" r="3" fill="#f7c55c"/>
  <circle cx="1030" cy="277" r="3" fill="#f7c55c"/>

  <text x="1010" y="340" font-family="Cinzel" font-size="34" letter-spacing="20" text-anchor="middle" fill="#c9b6f2" stroke="#c9b6f2" stroke-width="0.8">SERVER MANAGER</text>

  <!-- Gilded edges -->
  <rect x="0" y="0" width="1600" height="3" fill="url(#hairline)"/>
  <rect x="0" y="477" width="1600" height="3" fill="url(#hairline)"/>
  <rect x="1.5" y="1.5" width="1597" height="477" rx="23" ry="23" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="3"/>
</svg>
