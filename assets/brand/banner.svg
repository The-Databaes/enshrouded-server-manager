<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" width="1600" height="500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2338"/>
      <stop offset="1" stop-color="#090d17"/>
    </linearGradient>
    <linearGradient id="flameOuter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="0.45" stop-color="#f6a623"/>
      <stop offset="1" stop-color="#d9442b"/>
    </linearGradient>
    <linearGradient id="flameInner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8dc"/>
      <stop offset="1" stop-color="#ffcf5c"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b88420"/>
      <stop offset="0.5" stop-color="#ffd977"/>
      <stop offset="1" stop-color="#b88420"/>
    </linearGradient>
    <linearGradient id="goldText" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff0c2"/>
      <stop offset="0.5" stop-color="#f4c766"/>
      <stop offset="1" stop-color="#c98a1f"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f4c766" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#f4c766" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="emberGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb347" stop-opacity="0.7"/>
      <stop offset="0.6" stop-color="#f6a623" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#f6a623" stop-opacity="0"/>
    </radialGradient>
    <filter id="mist" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="48"/>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <clipPath id="frame">
      <rect x="0" y="0" width="1600" height="500" rx="28" ry="28"/>
    </clipPath>
  </defs>

  <rect x="0" y="0" width="1600" height="500" rx="28" ry="28" fill="url(#bg)"/>

  <g clip-path="url(#frame)">
    <!-- Shroud mist along the bottom and far right -->
    <ellipse cx="260" cy="470" rx="420" ry="110" fill="#2fc7b8" opacity="0.5" filter="url(#mist)"/>
    <ellipse cx="900" cy="520" rx="520" ry="120" fill="#1fb3c4" opacity="0.35" filter="url(#mist)"/>
    <ellipse cx="1450" cy="430" rx="380" ry="160" fill="#6d5bd0" opacity="0.35" filter="url(#mist)"/>
    <ellipse cx="800" cy="580" rx="900" ry="120" fill="#090d17" opacity="0.6" filter="url(#mist)"/>

    <!-- Ember glow behind the mark -->
    <circle cx="255" cy="250" r="230" fill="url(#emberGlow)"/>
  </g>

  <!-- Mark (same geometry as icon.svg, scaled) -->
  <g transform="translate(80 52) scale(0.34)">
    <ellipse cx="512" cy="796" rx="200" ry="42" fill="none" stroke="url(#ring)" stroke-width="14" opacity="0.9"/>
    <ellipse cx="512" cy="796" rx="200" ry="42" fill="none" stroke="#ffd977" stroke-width="30" opacity="0.25" filter="url(#soft)"/>
    <path d="M512 150 C548 262 704 352 704 548 C704 684 612 776 512 800 C412 776 320 684 320 548 C320 456 372 410 398 318 C410 390 450 428 474 402 C446 330 466 240 512 150 Z" fill="url(#flameOuter)"/>
    <path d="M512 150 C548 262 704 352 704 548 C704 684 612 776 512 800 C412 776 320 684 320 548 C320 456 372 410 398 318 C410 390 450 428 474 402 C446 330 466 240 512 150 Z" fill="none" stroke="#fff1bf" stroke-width="6" opacity="0.35"/>
    <path d="M512 400 C530 470 612 512 612 608 C612 678 566 724 512 736 C458 724 412 678 412 608 C412 556 440 536 452 486 C458 528 484 544 496 524 C480 480 490 448 512 400 Z" fill="url(#flameInner)"/>
  </g>

  <!-- Wordmark -->
  <text x="470" y="262" font-family="Cinzel" font-weight="700" font-size="124" letter-spacing="10" fill="url(#goldText)">ENSHROUDED</text>
  <rect x="474" y="292" width="760" height="3" fill="url(#rule)"/>
  <text x="474" y="356" font-family="Cinzel" font-weight="500" font-size="40" letter-spacing="18" fill="#7fe3d6">SERVER MANAGER</text>
  <text x="474" y="412" font-family="Cinzel" font-weight="400" font-size="22" letter-spacing="4" fill="#9aa3b8">Keep the Flame burning across Embervale</text>

  <rect x="3" y="3" width="1594" height="494" rx="26" ry="26" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="4"/>
</svg>
