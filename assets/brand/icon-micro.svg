<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="512" height="512">
  <!--
    The mark for 32px and below: the Flame alone. The tower in icon.svg is a
    grey smudge at this size, so this keeps only what reads: one bold flame
    with a white-hot core, on a violet tile light enough to stand off a dark
    title bar. Drawn on a 32 grid so its edges land on pixels at 16 and 32.
  -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4A3478"/>
      <stop offset="1" stop-color="#21163F"/>
    </linearGradient>
    <radialGradient id="glow" cx="16" cy="21" r="13" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFB347" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#FFB347" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="flame" x1="0" y1="4" x2="0" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFD98A"/>
      <stop offset="0.5" stop-color="#FFA93E"/>
      <stop offset="1" stop-color="#EE6F26"/>
    </linearGradient>
  </defs>

  <rect width="32" height="32" rx="7" fill="url(#tile)"/>
  <rect x="0.5" y="0.5" width="31" height="31" rx="6.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.1"/>
  <rect width="32" height="32" rx="7" fill="url(#glow)"/>

  <!-- The Flame: a tall drop with one lick breaking off on the left. -->
  <path
    d="M16 3 C17.6 7.8 23.5 11 23.5 18.6 C23.5 23.7 20.1 27.5 16 27.5 C11.9 27.5 8.5 23.7 8.5 18.6 C8.5 14.8 10.3 12.5 11.8 10.2 C12.2 12.5 13 13.7 14 14.1 C13.6 10.2 14.3 6.3 16 3 Z"
    fill="url(#flame)"
  />
  <!-- White-hot core. -->
  <path
    d="M16 13 C16.9 16.2 19.6 17.9 19.6 21.4 C19.6 23.8 18 25.6 16 25.6 C14 25.6 12.4 23.8 12.4 21.4 C12.4 17.9 15.1 16.2 16 13 Z"
    fill="#FFF6DC"
  />
</svg>
