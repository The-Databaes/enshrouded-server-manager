<!doctype html>
<!--
  The splash window, shown while the main window loads (src-tauri/src/splash.rs).
  Static on purpose: it paints at once, before the app's scripts are ready.

  The backend drives it through `window.splash`:
    init({ version, stage })   once the page has loaded
    stage("interface" | "steamcmd" | "server")
    complete()                 the app is ready: fills the progress bar
    ready()                    plays the finale; the window closes after it

  Opened in a plain browser it runs a demo instead (`?hold` stops before the
  finale). The Flame is the same drawing as assets/brand/icon-micro.svg.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Enshrouded Server Manager</title>
    <style>
      @font-face {
        font-family: "Cinzel";
        src: url("/splash/cinzel.woff2") format("woff2");
        font-weight: 400 900;
        font-display: block;
      }
      @font-face {
        font-family: "Barlow";
        src: url("/splash/barlow-500.woff2") format("woff2");
        font-weight: 500;
        font-display: block;
      }

      :root {
        --void: #0c0916;
        --gold-hi: #ffe3a3;
        --gold: #e8a33d;
        --gold-lo: #b8741f;
        --ember: #ffb347;
        --mist: #7b4fd1;
        --text: #e7e0f4;
        --muted: #9c8fbe;
        --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--void);
        color: var(--text);
        font-family: "Barlow", "Segoe UI", sans-serif;
        font-weight: 500;
        user-select: none;
        cursor: default;
      }

      #stage {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        isolation: isolate;
        background:
          radial-gradient(70% 60% at 50% 0%, #1d1534 0%, transparent 70%),
          var(--void);
        transition:
          opacity 0.45s ease,
          transform 0.45s ease;
      }
      /* The window's edge: a hairline, like the app's panels. */
      #stage::after {
        content: "";
        position: absolute;
        inset: 0;
        border: 1px solid rgb(183 140 242 / 0.14);
        pointer-events: none;
      }

      /* The Shroud, low and slow along the bottom. */
      .mist {
        position: absolute;
        left: -20%;
        right: -20%;
        bottom: -40px;
        height: 180px;
        z-index: -1;
        background:
          radial-gradient(40% 60% at 30% 70%, rgb(123 79 209 / 0.3), transparent 70%),
          radial-gradient(45% 55% at 72% 80%, rgb(142 91 224 / 0.22), transparent 70%);
        filter: blur(12px);
        animation: drift 14s ease-in-out infinite alternate;
      }
      @keyframes drift {
        to {
          transform: translateX(6%);
        }
      }

      /* The Flame ---------------------------------------------------------- */

      .mark {
        position: relative;
        margin-top: 58px;
        width: 64px;
        height: 88px;
      }
      .mark .glow {
        position: absolute;
        left: 50%;
        top: 62%;
        width: 260px;
        height: 260px;
        margin: -130px 0 0 -130px;
        border-radius: 50%;
        background: radial-gradient(closest-side, rgb(255 179 71 / 0.28), rgb(232 113 42 / 0.08) 55%, transparent);
        opacity: 0;
        transform: scale(0.6);
        transition:
          opacity 1s ease 0.15s,
          transform 1.2s var(--ease-out) 0.15s;
      }
      .mark svg {
        position: relative;
        display: block;
        width: 100%;
        height: 100%;
        overflow: visible;
      }
      .mark .flame {
        transform-box: fill-box;
        transform-origin: 50% 100%;
        opacity: 0;
        transform: scale(0.3);
        transition:
          opacity 0.4s ease 0.1s,
          transform 0.8s var(--ease-out) 0.1s;
      }
      .lit .mark .glow {
        opacity: 1;
        transform: none;
      }
      .lit .mark .flame {
        opacity: 1;
        transform: none;
      }
      /* Once caught, it breathes. */
      .lit .mark .outer {
        transform-box: fill-box;
        transform-origin: 50% 100%;
        animation: flicker 2.6s ease-in-out 0.9s infinite alternate;
      }
      .lit .mark .core {
        transform-box: fill-box;
        transform-origin: 50% 100%;
        animation: flicker-core 1.7s ease-in-out 0.9s infinite alternate;
      }
      @keyframes flicker {
        0% {
          transform: none;
        }
        40% {
          transform: scale(0.98, 1.04) skewX(-1.5deg);
        }
        100% {
          transform: scale(1.01, 0.97) skewX(1deg);
        }
      }
      @keyframes flicker-core {
        0% {
          transform: none;
        }
        100% {
          transform: scale(0.94, 1.07);
        }
      }

      /* Wordmark ------------------------------------------------------------ */

      .title {
        margin-top: 26px;
        text-align: center;
        opacity: 0;
        transform: translateY(6px);
        transition:
          opacity 0.6s ease 0.35s,
          transform 0.8s var(--ease-out) 0.35s;
      }
      .lit .title {
        opacity: 1;
        transform: none;
      }
      .title h1 {
        margin: 0;
        padding-left: 0.14em;
        font-family: "Cinzel", serif;
        font-size: 30px;
        font-weight: 700;
        line-height: 1;
        letter-spacing: 0.14em;
        background: linear-gradient(to bottom, var(--gold-hi) 10%, var(--gold) 62%, var(--gold-lo));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .title p {
        margin: 12px 0 0;
        padding-left: 0.24em;
        font-size: 12px;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: var(--muted);
      }

      /* Progress ------------------------------------------------------------ */

      .status {
        position: absolute;
        left: 50%;
        bottom: 44px;
        width: 240px;
        margin-left: -120px;
        text-align: center;
        opacity: 0;
        transition: opacity 0.6s ease 0.5s;
      }
      .lit .status {
        opacity: 1;
      }
      .track {
        height: 2px;
        border-radius: 2px;
        background: rgb(156 143 190 / 0.16);
        overflow: hidden;
      }
      .fill {
        height: 100%;
        width: 100%;
        border-radius: 2px;
        background: linear-gradient(to right, rgb(232 163 61 / 0.35), var(--ember));
        transform-origin: left;
        transform: scaleX(0);
      }
      #status-text {
        display: block;
        margin-top: 12px;
        font-size: 13px;
        color: var(--muted);
        transition: opacity 0.2s ease;
      }
      #status-text.swap {
        opacity: 0;
      }

      .version {
        position: absolute;
        right: 16px;
        bottom: 12px;
        font-size: 12px;
        color: rgb(156 143 190 / 0.7);
        font-variant-numeric: tabular-nums;
      }

      /* Finale: the Flame flares, and the window gives way to the app. */
      .ready .mark .glow {
        transform: scale(1.25);
        transition: transform 0.45s var(--ease-out);
      }
      #stage.leaving {
        opacity: 0;
        transform: scale(1.015);
      }

      .drag {
        position: absolute;
        inset: 0;
        z-index: 10;
      }

      @media (prefers-reduced-motion: reduce) {
        .mist,
        .lit .mark .outer,
        .lit .mark .core {
          animation: none;
        }
        .mark .flame,
        .mark .glow,
        .title,
        #stage.leaving {
          transform: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <div class="mist"></div>

      <div class="mark" aria-hidden="true">
        <div class="glow"></div>
        <svg viewBox="7 2 18 27">
          <defs>
            <linearGradient id="flame" x1="0" y1="3" x2="0" y2="28" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="#FFD98A" />
              <stop offset="0.5" stop-color="#FFA93E" />
              <stop offset="1" stop-color="#EE6F26" />
            </linearGradient>
          </defs>
          <g class="flame">
            <path
              class="outer"
              d="M16 3 C17.6 7.8 23.5 11 23.5 18.6 C23.5 23.7 20.1 27.5 16 27.5 C11.9 27.5 8.5 23.7 8.5 18.6 C8.5 14.8 10.3 12.5 11.8 10.2 C12.2 12.5 13 13.7 14 14.1 C13.6 10.2 14.3 6.3 16 3 Z"
              fill="url(#flame)"
            />
            <path
              class="core"
              d="M16 13 C16.9 16.2 19.6 17.9 19.6 21.4 C19.6 23.8 18 25.6 16 25.6 C14 25.6 12.4 23.8 12.4 21.4 C12.4 17.9 15.1 16.2 16 13 Z"
              fill="#FFF6DC"
            />
          </g>
        </svg>
      </div>

      <header class="title">
        <h1>Enshrouded</h1>
        <p>Server Manager</p>
      </header>

      <div class="status" role="status" aria-live="polite">
        <div class="track"><div class="fill" id="fill"></div></div>
        <span id="status-text">Starting up</span>
      </div>

      <span class="version" id="version"></span>
      <div class="drag" data-tauri-drag-region></div>
    </div>

    <script>
      (() => {
        const $ = (id) => document.getElementById(id);
        const stage = $("stage");

        // Progress: each stage the app reports moves the bar on; between
        // reports it creeps, so a slow step never looks frozen.
        const STAGES = {
          start: { at: 10, ceiling: 34, text: "Starting up" },
          interface: { at: 42, ceiling: 62, text: "Reading your setup" },
          steamcmd: { at: 68, ceiling: 86, text: "Checking on your server" },
          server: { at: 90, ceiling: 96, text: "Almost there" },
          ready: { at: 100, ceiling: 100, text: "Ready" },
        };
        const ORDER = Object.keys(STAGES);
        let current = "start";
        let target = STAGES.start.at;
        let shown = 0;

        const setText = (text) => {
          const el = $("status-text");
          if (el.textContent === text) return;
          el.classList.add("swap");
          setTimeout(() => {
            el.textContent = text;
            el.classList.remove("swap");
          }, 200);
        };

        const goTo = (name) => {
          if (!(name in STAGES) || ORDER.indexOf(name) <= ORDER.indexOf(current)) return;
          current = name;
          target = Math.max(target, STAGES[name].at);
          setText(STAGES[name].text);
        };

        const fill = $("fill");
        const tick = () => {
          const { ceiling } = STAGES[current];
          if (target < ceiling) target = Math.min(ceiling, target + (ceiling - target) * 0.004 + 0.01);
          shown += (target - shown) * (current === "ready" ? 0.2 : 0.06);
          if (current === "ready" && 100 - shown < 0.4) shown = 100;
          fill.style.transform = `scaleX(${shown / 100})`;
          requestAnimationFrame(tick);
        };
        requestAnimationFrame(tick);

        // The Flame catches as soon as the window is up.
        const lightUp = () => stage.classList.add("lit");
        requestAnimationFrame(() => requestAnimationFrame(lightUp));

        window.splash = {
          init({ version, stage: reached } = {}) {
            if (version) $("version").textContent = /^\d/.test(version) ? `v${version}` : version;
            if (reached) {
              for (const name of ORDER.slice(1, ORDER.indexOf(reached) + 1)) goTo(name);
            }
          },
          stage: goTo,
          complete() {
            goTo("ready");
          },
          ready() {
            lightUp();
            goTo("ready");
            stage.classList.add("ready");
            setTimeout(() => stage.classList.add("leaving"), 60);
          },
        };

        // Opened outside the app: play it through on its own.
        if (!("__TAURI_INTERNALS__" in window)) {
          const hold = new URLSearchParams(location.search).has("hold");
          window.splash.init({ version: "Preview" });
          setTimeout(() => goTo("interface"), 500);
          setTimeout(() => goTo("steamcmd"), 900);
          setTimeout(() => goTo("server"), 1200);
          setTimeout(() => window.splash.complete(), 1400);
          if (!hold) setTimeout(() => window.splash.ready(), 1600);
        }
      })();
    </script>
  </body>
</html>
